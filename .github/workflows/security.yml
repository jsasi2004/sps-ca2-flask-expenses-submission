name: Security Pipeline
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'  # Weekly Monday 02:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install bandit semgrep
      - name: Bandit SAST (Gate)
        run: bandit -r app.py -b bandit-baseline.json --severity-level high --confidence-level high
      - name: Bandit SAST (Report)
        run: bandit -r app.py -f json -o bandit.json --exit-zero
      - name: Semgrep SAST
        run: semgrep --config p/python --config p/flask --config .semgrep/ --severity ERROR --sarif --output semgrep.sarif .
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@b5c5b8c6c9e5e5d5e5d5e5d5e5d5e5d5e5d5e5d5 # v3.28.15
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  sca:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: SCA Scan
        run: pip-audit -r requirements.txt -f json -o pip-audit.json --desc on

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@8209a36c8b5c8c8c8c8c8c8c8c8c8c8c8c8c8c8 # v2.5.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  custom-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      APP_DB: /tmp/test_expenses.db
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt pytest
      - name: Seed test DB
        run: python seed.py
      - name: Run Custom Tests
        run: pytest tests/test_security.py -v --tb=short --junitxml=test-results.xml